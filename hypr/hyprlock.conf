general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

label {
    monitor =
    text = cmd[update:500] echo "$(date +"%H:%M")"
    color = rgba(245, 245, 245, 0.95)
    font_size = 90
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, 230
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(205, 214, 244, 0.85)
    font_size = 18
    font_family = JetBrains Mono Nerd Font Bold
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(205, 214, 244, 0.8)
    font_size = 15
    font_family = JetBrains Mono Nerd Font Bold
    position = 0, -65
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.2
    dots_center = true
    
    outer_color = rgba(203, 166, 247, 0.6)
    inner_color = rgba(24, 24, 37, 0.85)
    font_color = rgb(205, 214, 244)
    
    fade_on_empty = false
    font_family = JetBrains Mono Nerd Font
    placeholder_text = <i><span foreground="##cdd6f4">Password...</span></i>
    hide_input = false
    
    position = 0, -130
    halign = center
    valign = center

    check_color = rgba(166, 227, 161, 0.8)
    fail_color = rgba(243, 139, 168, 0.8)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 200
}
